name: Android CI - Build APK

on:
  push:
    branches: [ 'feature/shader-layers-kix-dark-theme' ]
  pull_request:
    branches: [ 'feature/shader-layers-kix-dark-theme' ]

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 31
          build-tools: '31.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build (assembleDebug)
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        uses: actions/upload-artifact@v4
        with:
          name: catroid-apks
          path: |
            **/build/outputs/**/*.apk

      - name: Upload Gradle build scan (optional)
        if: failure()
        run: echo "Build failed — check logs above"
